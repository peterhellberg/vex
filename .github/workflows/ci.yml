name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine pinned Zig version
        id: zig-version
        run: |
          echo "version=$(awk -F'"' '/\.minimum_zig_version/ {print $2; exit}' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned Zig toolchain
        # On a hit, install-zig.sh finds the existing binary and only
        # re-creates the symlink.
        uses: actions/cache@v5
        with:
          path: /tmp/zig-pinned
          key: zig-${{ runner.os }}-${{ steps.zig-version.outputs.version }}

      - name: Cache Zig build caches
        # One entry per pinned Zig version, saved once and reused exactly:
        # on an exact hit actions/cache skips the post-job upload entirely.
        # Staleness is not a concern because both caches are
        # content-addressed -- changed sources get new hashes and rebuild,
        # and fetched packages live under their .zon hashes. The
        # restore-keys fallback warms a fresh entry (e.g. after a pin bump)
        # from the closest previous one.
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-pkg
            cmd/vex/.zig-cache
            cmd/vex/zig-pkg
          key: zcache-${{ runner.os }}-${{ steps.zig-version.outputs.version }}
          restore-keys: |
            zcache-${{ runner.os }}-

      - name: Install pinned Zig (version from build.zig.zon)
        run: ./scripts/install-zig.sh
        env:
          ZIG_DIR: /tmp/zig-pinned

      - name: Add zig to PATH
        run: echo "/tmp/zig-pinned" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          # This repo has no root go.sum; it is a go.work workspace.
          cache-dependency-path: go.work.sum

      # gcc is never used; zig cc stands in as the C compiler throughout.
      - name: Use zig cc as the C compiler
        run: |
          echo "CC=zig cc" >> "$GITHUB_ENV"

      - name: Install X11/GL dev libraries (raylib link deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev pkg-config

      - name: Build SDK package (vex-init, example + test carts)
        # Debug builds keep CI fast; these steps only verify compilation.
        run: zig build --prefix .

      - name: Build C host (cmd/vex)
        run: cd cmd/vex && zig build --prefix ../..

      - name: Run Zig tests (spr.zig)
        run: zig build test

      - name: Vet, test, and build root Go module
        run: |
          go vet ./... && go test ./...
          go build -o bin/vex-web ./cmd/vex-web
