name: vex-run

# cmd/vex-run depends on ebitengine (cgo, X11/ALSA link deps), which makes it
# too heavy to run on every PR; this workflow is triggered manually instead.
on:
  workflow_dispatch:

jobs:
  vex-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine pinned Zig version
        id: zig-version
        run: |
          echo "version=$(awk -F'"' '/\.minimum_zig_version/ {print $2; exit}' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned Zig toolchain
        uses: actions/cache@v5
        with:
          path: /tmp/zig-pinned
          key: zig-${{ runner.os }}-${{ steps.zig-version.outputs.version }}

      - name: Install pinned Zig (version from build.zig.zon)
        run: ./scripts/install-zig.sh
        env:
          ZIG_DIR: /tmp/zig-pinned

      - name: Add zig to PATH
        run: echo "/tmp/zig-pinned" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: cmd/vex-run/go.sum

      # gcc is never used; zig cc stands in as the C compiler throughout.
      - name: Use zig cc as the C compiler
        run: |
          echo "CC=zig cc" >> "$GITHUB_ENV"

      - name: Install X11/GL/ALSA dev libraries (ebitengine cgo link deps)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - name: Vet, test, and build cmd/vex-run
        working-directory: cmd/vex-run
        run: |
          go vet ./... && go test ./...
          go build -o ../../bin/vex-run .
